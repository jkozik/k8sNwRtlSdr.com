apiVersion: apps/v1
kind: Deployment
metadata:
  name: nwrtlsdr
  labels:
    app: nwrtlsdr
spec:
  selector:
    matchLabels:
      app: nwrtlsdr
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      
  template:
    metadata:
      labels:
        app: nwrtlsdr
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: nwrtlsdr
            topologyKey: kubernetes.io/hostname      
      containers:
      - image: jkozik/nwrtlsdr.com:v1.1
        name: nwrtlsdr
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
            ephemeral-storage: 250M
          limits:
            memory: 384Mi
            ephemeral-storage: 500M
        ports:
        - containerPort: 80
          name: nwrtlsdr
        volumeMounts:
        - name: php-cve-2026-109619
          mountPath: /usr/local/etc/php/conf.d/zz-cve-2026-109619.ini
          subPath: zz-cve-2026-109619.ini
          readOnly: true
        - name: nwrtlsdr-persistent-storage
          mountPath: "/var/www/html/mount"
          readOnly: true
        readinessProbe:
          httpGet:
            path: /wxstatus.php
            port: 80
          initialDelaySeconds: 20
          timeoutSeconds: 30
      volumes:
      - name: php-cve-2026-109619
        configMap:
          name: php-cve-2026-109619
      - name: nwrtlsdr-persistent-storage
        persistentVolumeClaim:
          claimName: nwrtlsdr-persistent-storage
